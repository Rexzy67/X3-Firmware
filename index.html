<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repository Index</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #333;
    }
    h1 { border-bottom: 2px solid #eee; padding-bottom: 0.5rem; }
    ul { list-style-type: none; padding: 0; }
    li {
      padding: 0.5rem 0.8rem;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
    }
    li:hover { background-color: #f9f9f9; }
    a { color: #0969da; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge {
      font-size: 0.8rem;
      background: #e1f5fe;
      color: #0288d1;
      padding: 2px 8px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <h1>Repository Files</h1>
  <ul id="file-list">Loading files...</ul>

  <script>
    // Replace with your GitHub details
    const USERNAME = 'rexzy67';
    const REPO = 'X3-Firmware';

    async function loadRepoFiles() {
      const listElement = document.getElementById('file-list');
      try {
        const response = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents/`);
        if (!response.ok) throw new Error('Failed to fetch files');
        
        const files = await response.json();
        listElement.innerHTML = '';

        files.forEach(file => {
          // Exclude index.html from the display list if desired
          if (file.name === 'index.html') return;

          const li = document.createElement('li');
          const link = document.createElement('a');
          
          link.href = file.download_url || file.html_url;
          link.textContent = file.name;
          
          const typeBadge = document.createElement('span');
          typeBadge.className = 'badge';
          typeBadge.textContent = file.type;

          li.appendChild(link);
          li.appendChild(typeBadge);
          listElement.appendChild(li);
        });
      } catch (error) {
        listElement.innerHTML = `<li style="color: red;">Error: ${error.message}. Check back later. Theres probably an issue with the API request. Or the Site is being updated.</li>`;
      }
    }

    loadRepoFiles();
  </script>

</body>
</html>
