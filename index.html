<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X3-Firmware Repository</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --link-color: #58a6ff;
      --hover-bg: #21262d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h1 {
      font-size: 1.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.75rem;
      margin-bottom: 1rem;
    }

    .breadcrumb {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .breadcrumb span {
      color: var(--link-color);
      cursor: pointer;
    }

    .breadcrumb span:hover {
      text-decoration: underline;
    }

    ul.file-list {
      list-style: none;
      padding: 0;
      margin: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
    }

    li.file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    li.file-item:last-child {
      border-bottom: none;
    }

    li.file-item:hover {
      background-color: var(--hover-bg);
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
    }

    .icon {
      font-size: 1.1rem;
    }

    a.item-name, span.item-name {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 500;
    }

    a.item-name:hover, span.item-name:hover {
      text-decoration: underline;
    }

    .error-msg {
      padding: 1.5rem;
      background: #271010;
      border: 1px solid #6e1a1a;
      border-radius: 6px;
      color: #ff7b72;
      font-weight: 500;
      text-align: center;
    }

    .back-btn {
      color: var(--text-muted) !important;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>rexzy67 / X3-Firmware</h1>
  
  <div class="breadcrumb" id="breadcrumb">Path: root</div>

  <ul class="file-list" id="file-list">
    <li class="file-item">Loading files...</li>
  </ul>

  <script>
    const USERNAME = 'rexzy67';
    const REPO = 'X3-Firmware';
    let currentPath = '';

    async function fetchDirectory(path = '') {
      const listElement = document.getElementById('file-list');
      const breadcrumbElement = document.getElementById('breadcrumb');
      
      try {
        const url = `https://api.github.com/repos/${USERNAME}/${REPO}/contents/${path}`;
        const response = await fetch(url);
        
        if (!response.ok) {
          throw new Error('API Request failed');
        }

        const files = await response.json();
        currentPath = path;

        // Update Breadcrumb UI
        updateBreadcrumb(path);

        listElement.innerHTML = '';

        // Add "Go Back" item if inside a subfolder
        if (path !== '') {
          const parentPath = path.substring(0, path.lastIndexOf('/'));
          const backLi = document.createElement('li');
          backLi.className = 'file-item';
          backLi.innerHTML = `
            <div class="item-info" onclick="fetchDirectory('${parentPath}')">
              <span class="icon">📁</span>
              <span class="item-name back-btn">.. (Go Back)</span>
            </div>
          `;
          listElement.appendChild(backLi);
        }

        // Sort: Folders first, then Files
        files.sort((a, b) => (b.type === 'dir') - (a.type === 'dir'));

        files.forEach(file => {
          if (file.name === 'index.html' && path === '') return; // Skip root index.html

          const li = document.createElement('li');
          li.className = 'file-item';

          if (file.type === 'dir') {
            li.innerHTML = `
              <div class="item-info" onclick="fetchDirectory('${file.path}')">
                <span class="icon">📁</span>
                <span class="item-name">${file.name}</span>
              </div>
            `;
          } else {
            // For raw files, open directly in a new tab
            const rawUrl = `https://raw.githubusercontent.com/${USERNAME}/${REPO}/main/${file.path}`;
            li.innerHTML = `
              <div class="item-info">
                <span class="icon">📄</span>
                <a class="item-name" href="${rawUrl}" target="_blank" rel="noopener">${file.name}</a>
              </div>
            `;
          }

          listElement.appendChild(li);
        });

      } catch (error) {
        listElement.innerHTML = `
          <div class="error-msg">
            Check back later. Theres probably an issue with the API request. Or the Site is being updated.
          </div>
        `;
      }
    }

    function updateBreadcrumb(path) {
      const breadcrumbElement = document.getElementById('breadcrumb');
      if (!path) {
        breadcrumbElement.innerHTML = '<strong>Path:</strong> root';
        return;
      }

      const parts = path.split('/');
      let accumulatedPath = '';
      let html = '<strong>Path:</strong> <span onclick="fetchDirectory(\'\')">root</span>';

      parts.forEach((part, index) => {
        accumulatedPath += (index === 0 ? '' : '/') + part;
        const targetPath = accumulatedPath;
        html += ` / <span onclick="fetchDirectory('${targetPath}')">${part}</span>`;
      });

      breadcrumbElement.innerHTML = html;
    }

    // Initial Load
    fetchDirectory();
  </script>

</body>
</html>
